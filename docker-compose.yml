services:
  db:
    image: postgres:16
    # Local teaching credentials only. Never use these credentials in production.
    environment:
      POSTGRES_DB: trello
      POSTGRES_USER: trello
      POSTGRES_PASSWORD: trello
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trello -d trello']
      interval: 2s
      timeout: 3s
      retries: 15

  pgweb:
    image: sosedoff/pgweb:0.16.2
    environment:
      PGWEB_DATABASE_URL: postgres://trello:trello@db:5432/trello?sslmode=disable
    ports:
      - '8081:8081'
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9
    # Local teaching credentials only. Never use these credentials in production.
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres-data:
  pgadmin-data:
